<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design note · SolidCraft prototypes</title>
<link rel="stylesheet" href="../shared/note.css">
<style>
#note video { width: 100%; height: auto; display: block; border-radius: 6px; }
#note figure { margin: 1.2em 0; }
#note figcaption { font-size: 0.9em; opacity: 0.75; margin-top: 0.3em; }
#note .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 1.2em 0; }
#note .pair figure { margin: 0; }
#note code { font: 600 0.85em/1 ui-monospace, "SF Mono", Menlo, monospace; padding: 0.15em 0.45em; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--bg); white-space: nowrap; }
@media (max-width: 700px) { #note .pair { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
<a class="back" href="../">SolidCraft prototypes</a>
<article id="note"></article>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="../shared/note.js"></script>
</body>
</html>
